name: Check and package WordPress theme
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP source
        run: |
          find muc-may-studio muc-may-demo-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package theme
        run: |
          zip -qr muc-may-studio-theme.zip muc-may-studio -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: muc-may-studio-theme
          path: muc-may-studio-theme.zip
